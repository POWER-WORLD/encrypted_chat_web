# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec
services:
  # -------------------------------------------------------------
  # Backend Web Service (Node.js / Express / Socket.IO)
  # -------------------------------------------------------------
  - type: web
    name: encrypted-chat-web
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://encrypted-chats.onrender.com

  # -------------------------------------------------------------
  # Frontend Static Site (React 19 / Vite / Tailwind CSS)
  # -------------------------------------------------------------
  - type: web
    name: encrypted-chats
    env: static
    plan: free
    region: oregon
    rootDir: frontend2
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://encrypted-chat-web.onrender.com
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
